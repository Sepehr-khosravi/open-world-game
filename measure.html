<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Measure Kenney Assets</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #111; color: #0f0; }
    pre { font-size: 13px; line-height: 1.6; }
    table { border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #444; padding: 6px 10px; text-align: left; }
    th { background: #222; }
  </style>
</head>
<body>
  <h1>Measuring Kenney Assets...</h1>
  <div id="status">Loading...</div>
  <div id="output"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    const loader = new GLTFLoader();
    const out = document.getElementById('output');
    const status = document.getElementById('status');

    /*
     * همه فایل‌هایی که می‌خوایم اندازه بگیریم.
     * از ریشه‌ی public، با اسلش اول.
     */
    const files = [
      // Roads — همه قطعات مهم
      '/models/city/roads/GLB format/road-straight.glb',
      '/models/city/roads/GLB format/road-crossroad.glb',
      '/models/city/roads/GLB format/road-crossroad-line.glb',
      '/models/city/roads/GLB format/road-bend.glb',
      '/models/city/roads/GLB format/road-bend-sidewalk.glb',
      '/models/city/roads/GLB format/road-side.glb',
      '/models/city/roads/GLB format/road-side-entry.glb',
      '/models/city/roads/GLB format/road-side-exit.glb',
      '/models/city/roads/GLB format/road-curve.glb',
      '/models/city/roads/GLB format/road-crossing.glb',
      '/models/city/roads/GLB format/road-intersection.glb',
      '/models/city/roads/GLB format/road-intersection-line.glb',
      '/models/city/roads/GLB format/road-split.glb',
      '/models/city/roads/GLB format/road-square.glb',
      '/models/city/roads/GLB format/road-end.glb',
      '/models/city/roads/GLB format/road-driveway-single.glb',
      '/models/city/roads/GLB format/road-driveway-double.glb',
      '/models/city/roads/GLB format/road-roundabout.glb',
      '/models/city/roads/GLB format/road-bridge.glb',
      '/models/city/roads/GLB format/tile-low.glb',
      '/models/city/roads/GLB format/tile-high.glb',
      '/models/city/roads/GLB format/traffic-light.glb',
      '/models/city/roads/GLB format/light-square.glb',
      '/models/city/roads/GLB format/light-curved.glb',
      '/models/city/roads/GLB format/road-sign-warning.glb',
      '/models/city/roads/GLB format/road-sign-stop.glb',
      '/models/city/roads/GLB format/electricity-pole.glb',

      // Buildings
      '/models/city/buildings/building-type-a.glb',
      '/models/city/buildings/building-type-b.glb',
      '/models/city/buildings/building-type-c.glb',
      '/models/city/buildings/building-type-d.glb',
      '/models/city/buildings/building-type-e.glb',
      '/models/city/buildings/building-type-f.glb',

      // Vegetation
      '/models/city/vegetation/tree-large.glb',
      '/models/city/vegetation/tree-small.glb',

      // Props
      '/models/city/props/planter.glb',
      '/models/city/props/fence.glb',
      '/models/city/props/fence-1x2.glb',
      '/models/city/props/fence-2x2.glb',
      '/models/city/props/path-long.glb',
      '/models/city/props/path-short.glb',
      '/models/city/props/driveway-long.glb',
      '/models/city/props/driveway-short.glb',
    ];

    const results = [];

    async function measureOne(url) {
      try {
        const gltf = await loader.loadAsync(url);
        const model = gltf.scene;

        // مهم: قبل از اندازه‌گیری، transform ها رو به‌روز کن
        model.updateMatrixWorld(true);

        const box = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);

        return {
          file: url.split('/').pop(),
          sx: size.x.toFixed(4),
          sy: size.y.toFixed(4),
          sz: size.z.toFixed(4),
          cx: center.x.toFixed(4),
          cy: center.y.toFixed(4),
          cz: center.z.toFixed(4),
          minY: box.min.y.toFixed(4),
          maxY: box.max.y.toFixed(4),
        };
      } catch (e) {
        return { file: url.split('/').pop(), error: e.message };
      }
    }

    (async () => {
      for (let i = 0; i < files.length; i++) {
        status.textContent = `Loading ${i + 1}/${files.length}: ${files[i].split('/').pop()}`;
        const r = await measureOne(files[i]);
        results.push(r);
      }

      status.textContent = `Done! ${results.length} files measured.`;

      // چاپ به کنسول مرورگر (F12 → Console)
      console.log('=== MEASUREMENT RESULTS ===');
      console.table(results);
      console.log('=== JSON ===');
      console.log(JSON.stringify(results, null, 2));

      // نمایش توی صفحه
      let html = '<table><tr><th>File</th><th>Size X</th><th>Size Y</th><th>Size Z</th><th>Center X</th><th>Center Z</th><th>Min Y</th></tr>';
      for (const r of results) {
        if (r.error) {
          html += `<tr style="color:red"><td>${r.file}</td><td colspan="6">ERROR: ${r.error}</td></tr>`;
        } else {
          html += `<tr><td>${r.file}</td><td>${r.sx}</td><td>${r.sy}</td><td>${r.sz}</td><td>${r.cx}</td><td>${r.cz}</td><td>${r.minY}</td></tr>`;
        }
      }
      html += '</table>';
      out.innerHTML = html;
    })();
  </script>
</body>
</html>
